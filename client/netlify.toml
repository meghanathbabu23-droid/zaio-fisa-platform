[build]
  command = "npm run build"
  publish = "dist"

# Proxies /api/* to the live Render backend so the browser sees everything
# as same-origin — no VITE_API_BASE_URL, no cross-origin cookie changes
# needed. Must stay ABOVE the SPA fallback below, or /api requests would be
# swallowed by index.html instead.
[[redirects]]
  from = "/api/*"
  to = "https://zaio-fisa-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routing (react-router) works on refresh/deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
